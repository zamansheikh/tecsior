name: Deploy to VPS

# Auto-deploy on every push to main.
# Manually trigger via Actions → "Deploy to VPS" → Run workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "design-system/**"
      - "logo/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH and run deploy.sh
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Hardcoded — change here if you bootstrapped the VPS to a different path.
          APP_DIR: /var/www/tecsior
          REPO_URL: https://github.com/${{ github.repository }}.git
          BRANCH: main
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: APP_DIR,REPO_URL,BRANCH
          script: |
            set -e

            # Prereq check — node, npm, git, pm2 must already be installed.
            # deploy/setup-vps.sh handles that bootstrap; we don't auto-install
            # system packages over SSH (would require sudo, security tradeoff).
            for cmd in git node npm pm2; do
              if ! command -v "$cmd" >/dev/null 2>&1; then
                echo "::error::'$cmd' is not installed on the VPS."
                echo "Run this once on the VPS as a sudo user, then re-run this workflow:"
                echo "  curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/$BRANCH/deploy/setup-vps.sh -o setup-vps.sh"
                echo "  sudo bash setup-vps.sh"
                exit 1
              fi
            done

            # Auto-clone on first deploy so this workflow self-heals.
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "▸ Repo not yet on this VPS — cloning $REPO_URL → $APP_DIR"
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --quiet origin "$BRANCH"
            git reset --hard "origin/$BRANCH" --quiet
            bash deploy/deploy.sh
